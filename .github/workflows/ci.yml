# Checks every push and pull request: types, unit tests and the web build (Stack_Decision_Record S-18).
# Database migrations and end-to-end tests join once the staging project and demo accounts exist.
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @sgsi/shared test
      - run: pnpm --filter @sgsi/web exec vite build
