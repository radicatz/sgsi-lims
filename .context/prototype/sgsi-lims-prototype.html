* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface-background); color: var(--text-foreground); font: 400 14px/22px var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--primary-200); outline-offset: 1px; }
.boot { padding: 40px; font-family: var(--f-body); color: var(--text-secondary); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- text styles ---------- */
.t-display { font: 500 36px/42px var(--f-display); color: var(--text-heading); margin: 0; text-wrap: balance; }
.t-h1 { font: 600 28px/34px var(--f-display); color: var(--text-heading); margin: 0; }
.t-h2 { font: 600 22px/28px var(--f-display); color: var(--text-heading); margin: 0; }
.t-h3 { font: 600 18px/24px var(--f-display); color: var(--text-heading); margin: 0; }
.t-lead { font: italic 500 18px/28px var(--f-display); color: var(--text-secondary); }
.t-num { font: 500 30px/34px var(--f-display); color: var(--text-heading); }
.t-body { font: 400 14px/22px var(--f-body); }
.t-sm { font: 400 13px/20px var(--f-body); }
.t-cap { font: 400 12px/16px var(--f-body); }
.t-over { font: 500 11px/16px var(--f-mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
.t-data { font: 400 13px/20px var(--f-mono); font-variant-numeric: tabular-nums; }
.t-data-b { font: 600 13px/20px var(--f-mono); font-variant-numeric: tabular-nums; }
.w5 { font-weight: 500; } .w6 { font-weight: 600; }
.c-sec { color: var(--text-secondary); } .c-mut { color: var(--text-muted); } .c-err { color: var(--feedback-error); } .c-ok { color: var(--feedback-success); } .c-warn { color: var(--feedback-warning); } .c-head { color: var(--text-heading); } .c-brand { color: var(--action-brand-text); }
.num { font-variant-numeric: tabular-nums; }
.link { color: var(--action-brand-text); font-weight: 600; cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; }
.plain { color: inherit; }

/* ---------- layout helpers ---------- */
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.top { align-items: flex-start; } .row.wrap { flex-wrap: wrap; } .row.end { justify-content: flex-end; } .row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.g4 { gap: 4px; } .g6 { gap: 6px; } .g10 { gap: 10px; } .g12 { gap: 12px; } .g16 { gap: 16px; } .g20 { gap: 20px; } .g24 { gap: 24px; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid { display: grid; gap: 20px; min-width: 0; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- icon ---------- */
.ph { display: inline-flex; width: 14px; height: 14px; flex: none; }
.ph svg { width: 100%; height: 100%; }
.ph.i20 { width: 20px; height: 20px; } .ph.i16 { width: 16px; height: 16px; } .ph.i24 { width: 24px; height: 24px; } .ph.i32 { width: 32px; height: 32px; }

/* ---------- review bar and stage ---------- */
.stage { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--surface-sand); }
.rbar { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--other-review); color: var(--other-review-fg); font: 500 12px/16px var(--f-body); position: relative; z-index: 50; }
.rbar .brandline { display: flex; flex-direction: column; margin-right: 6px; }
.rbar .brandline b { font: 600 15px/18px var(--f-display); }
.rbar .brandline small { opacity: .7; font-size: 11px; }
.rbar .rl { opacity: .7; font: 500 10px/14px var(--f-mono); letter-spacing: 1px; text-transform: uppercase; }
.rseg { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; gap: 2px; }
.rseg button { color: #fff; padding: 5px 8px; border-radius: 999px; font: 500 12px/16px var(--f-body); opacity: .82; white-space: nowrap; }
.rseg button[aria-pressed="true"] { background: #fff; color: #0E2A4E; opacity: 1; }
.rbtn { display: inline-flex; align-items: center; gap: 6px; color: #fff; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); font: 500 12px/16px var(--f-body); white-space: nowrap; }
.rbtn:hover { background: rgba(255,255,255,.08); }
.rpanel { position: absolute; right: 12px; top: calc(100% + 6px); width: min(560px, calc(100vw - 24px)); max-height: 70vh; overflow: auto; background: var(--surface-card); color: var(--text-foreground); border: 1px solid var(--surface-border); border-radius: 16px; box-shadow: var(--e-xl); padding: 20px; z-index: 60; }
.rpanel h2 { font: 600 20px/26px var(--f-display); color: var(--text-heading); margin: 0 0 6px; }
.rpanel .lead { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
.rpanel .grp { font: 500 11px/16px var(--f-mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 6px; }
.flow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--surface-divider); }
.flow .id { font: 600 12px/20px var(--f-mono); color: var(--action-brand-text); }
.flow b { display: block; font-size: 13px; } .flow span { font-size: 12px; color: var(--text-secondary); }
.speclist { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-secondary); }
.speclist li { margin: 4px 0; }
.rtab { position: fixed; top: env(safe-area-inset-top, 0px); left: 50%; transform: translateX(-50%); z-index: 70; background: var(--other-review); color: #fff; border-radius: 0 0 10px 10px; padding: 2px 14px; }
.viewport { flex: 1 1 auto; overflow: hidden; position: relative; display: flex; justify-content: center; }
.frame { position: relative; background: var(--surface-shell); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--e-md); }

.brand b { display: block; font: 600 28px/30px var(--f-display); color: var(--text-heading); letter-spacing: .2px; }
.brand small { display: block; font: 400 13px/16px var(--f-body); color: var(--text-secondary); }
.tablet .brand b { font-size: 24px; }
.body { flex: 1 1 auto; display: flex; min-height: 0; }
.side { flex: none; width: 248px; background: var(--surface-shell); border-right: 1px solid var(--surface-border); padding: 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.side.rail { width: 88px; }
.nav { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 10px; color: var(--text-secondary); font: 500 14px/22px var(--f-body); width: 100%; text-align: left; }
.nav:hover { background: var(--primary-50); }
.nav:active { background: var(--primary-100); }
.nav.on { background: var(--action-nav-active); color: var(--text-inverse); }
.rail .nav { justify-content: center; padding: 0; }
.rail .nav span.lbl { display: none; }
.nav .cnt { margin-left: auto; background: var(--accent-100); color: var(--accent-text); font: 600 12px/18px var(--f-body); padding: 0 6px; border-radius: 999px; min-width: 22px; text-align: center; }
.rail .nav .cnt { position: absolute; margin: -22px 0 0 26px; }
.navgroup { display: flex; align-items: center; gap: 6px; padding: 14px 14px 6px; font: 500 11px/16px var(--f-mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
.navgroup span { flex: 1; }
.raildiv { height: 1px; background: var(--surface-divider); margin: 8px 0; }
.main { flex: 1 1 auto; min-width: 0; overflow-y: auto; overflow-x: hidden; background: var(--surface-shell); position: relative; }
.page { padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.tablet .page { padding: 24px 24px 32px; }
.phone .page { padding: 16px 16px 24px; gap: 16px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .tt { display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-width: 0; }
.phone .page-head .t-display { font-size: 28px; line-height: 34px; }
.crumb { display: flex; align-items: center; gap: 6px; font: 500 12px/16px var(--f-body); color: var(--text-secondary); flex-wrap: wrap; }
.crumb a { color: var(--text-secondary); cursor: pointer; } .crumb a:hover { color: var(--action-brand-text); text-decoration: underline; }
.crumb b { color: var(--text-foreground); font-weight: 600; }

/* top bar parts */
.tsearch { width: 400px; height: 40px; border: 1px solid var(--surface-border-strong); background: var(--surface-card); border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; color: var(--text-muted); position: relative; }
.tablet .tsearch { width: 260px; }
.tsearch input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; color: var(--text-foreground); }
.tsearch input::placeholder { color: var(--text-muted); }
.tsearch:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-200); }
.scanbtn { width: 28px; height: 28px; border-radius: 999px; background: var(--accent-100); color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.bellwrap { position: relative; width: 36px; height: 36px; flex: none; }
.bellwrap .badge-n { position: absolute; left: 22px; top: -4px; box-shadow: var(--e-xs); }
.userchip { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 2px; border-radius: 999px; }
.userchip b { display: block; font: 600 13px/20px var(--f-body); white-space: nowrap; }
.userchip small { display: block; font: 400 12px/16px var(--f-body); color: var(--text-secondary); white-space: nowrap; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; font: 600 13px/18px var(--f-body); white-space: nowrap; border: 1px solid transparent; flex: none; transition: background .12s; }
.btn.lg { height: 40px; padding: 0 16px; font-size: 14px; line-height: 20px; }
.btn.sm { height: 28px; padding: 0 10px; gap: 6px; font-size: 12px; line-height: 16px; }
.btn.touch { height: 44px; padding: 0 20px; font-size: 14px; line-height: 20px; }
.btn.block { width: 100%; }
.btn.primary { background: var(--action); color: var(--action-foreground); }
.btn.primary:hover { background: var(--action-hover); } .btn.primary:active { background: var(--action-strong); }
.btn.secondary { background: var(--surface-card); border-color: var(--surface-border-strong); color: var(--action-brand-text); }

/* ---------- cards ---------- */

.search { height: 40px; border: 1px solid var(--surface-border-strong); background: var(--surface-card); border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text-muted); min-width: 0; }

.cb, .rd { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font: 400 14px/20px var(--f-body); user-select: none; }
.cb .box { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--surface-border-strong); background: var(--surface-card); display: inline-flex; align-items: center; justify-content: center; color: var(--action-foreground); flex: none; }

.sw { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font: 400 14px/20px var(--f-body); user-select: none; }

.sw .tr::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: var(--surface-card); box-shadow: 0 1px 2px rgba(14,42,78,.2); transition: left .15s; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--surface-border-strong); background: var(--surface-card); color: var(--action-brand-text); font: 600 13px/20px var(--f-body); white-space: nowrap; flex: none; }
.chip .n { font-weight: 500; }
.chip:hover { background: var(--primary-50); }

.chip.sm { height: 32px; padding: 0 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }

.seg { display: inline-flex; background: var(--surface-muted); border-radius: 999px; padding: 4px; gap: 2px; flex: none; }
.seg button { height: 28px; padding: 0 12px; border-radius: 999px; font: 500 13px/18px var(--f-body); color: var(--text-secondary); }
.seg button[aria-pressed="true"] { background: var(--surface-card); color: var(--action-brand-text); font-weight: 600; box-shadow: var(--e-2xs); }
.tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--surface-border); overflow-x: auto; scrollbar-width: none; flex: none; }
.tab { height: 36px; display: inline-flex; flex-direction: column; justify-content: flex-start; flex: none; }

.ppill { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--surface-border-strong); background: var(--surface-card); color: var(--text-secondary); font: 500 13px/20px var(--f-body); white-space: nowrap; }
.ppill:hover { background: var(--primary-50); }
.ppill.on { background: var(--primary-50); border-color: var(--action); color: var(--action-brand-text); }
.ppill.lock { background: var(--surface-muted); border-color: var(--surface-border); color: var(--text-secondary); cursor: default; }

/* ---------- tables ---------- */

.tbl tr.sel td { background: var(--primary-50); }

.dirty { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--accent); }
.pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pager .info { flex: 1; font: 400 13px/20px var(--f-body); color: var(--text-secondary); }
.pager .pg { width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--surface-border-strong); background: var(--surface-card); color: var(--action-brand-text); font: 500 12px/16px var(--f-body); display: inline-flex; align-items: center; justify-content: center; }
.pager .pg.on { background: var(--action); color: var(--action-foreground); border-color: var(--action); }

.mcard { background: var(--surface-card); border: 1px solid var(--surface-border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }

.progress i { display: block; height: 100%; background: var(--action); border-radius: 3px; }
.progress.ok i { background: var(--status-st-completed); } .progress.warn i { background: var(--status-st-prep); }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-divider); font: 400 13px/20px var(--f-body); }
.kv:last-child { border-bottom: 0; }
.kv > span:first-child { color: var(--text-secondary); }
.phone .kv { grid-template-columns: 1fr; gap: 2px; }
.divider { height: 1px; background: var(--surface-divider); flex: none; }

/* stepper */
.stepper { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1 1 0; min-width: 96px; position: relative; text-align: center; }
.step .mk { width: 24px; height: 24px; border-radius: 12px; border: 2px solid var(--surface-border-strong); background: var(--surface-card); display: inline-flex; align-items: center; justify-content: center; z-index: 1; color: var(--text-inverse); }
.step.done .mk { background: var(--status-st-completed); border-color: var(--status-st-completed); }
.step.cur .mk { border-color: var(--accent); } .step.cur .mk::after { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }
.step:not(:last-child)::after { content: ""; position: absolute; top: 11px; left: calc(50% + 14px); right: calc(-50% + 14px); height: 2px; background: var(--surface-border-strong); }
.step.done:not(:last-child)::after { background: var(--status-st-completed); }
.step b { font: 600 13px/20px var(--f-body); color: var(--text-heading); } .step.up b { color: var(--text-muted); }
.step small { font: 400 12px/16px var(--f-body); color: var(--text-secondary); }
.vstep { display: flex; flex-direction: column; gap: 10px; }
.vstep .step { flex-direction: row; align-items: center; text-align: left; min-width: 0; }
.vstep .step::after { display: none; }

/* ---------- overlays ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; }
.dialog { background: var(--surface-card); border: 1px solid var(--surface-border); border-radius: 16px; box-shadow: var(--e-lg); width: 560px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; }

.fullscreen .fb { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

.fullscreen .ff .btn { flex: 1; }
.menu { position: absolute; z-index: 45; background: var(--surface-card); border: 1px solid var(--surface-border); border-radius: 12px; box-shadow: var(--e-md); padding: 6px; min-width: 200px; display: flex; flex-direction: column; gap: 2px; }
.mi { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; font: 500 13px/20px var(--f-body); color: var(--text-foreground); text-align: left; width: 100%; white-space: nowrap; }
.mi:hover { background: var(--primary-50); }

.mi .meta { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.mdiv { height: 1px; background: var(--surface-divider); margin: 4px 0; }
.toasts { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 80; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--primary-deep); color: var(--text-inverse); border-radius: 12px; padding: 12px 16px; font: 600 13px/20px var(--f-body); box-shadow: var(--e-lg); }
.toast .ph { color: var(--status-st-completed); }
.toast.error .ph { color: var(--rust); } .toast.info .ph { color: var(--accent-soft); }
.toast button { color: var(--accent-soft); font-weight: 600; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 12px; border: 1px solid var(--f); background: var(--b); }
.alert .ph { color: var(--f); margin-top: 3px; }
.alert b { display: block; color: var(--f); font: 600 13px/20px var(--f-body); }
.alert span { display: block; color: var(--text-secondary); font: 400 12px/16px var(--f-body); }
.al-error { --b: var(--feedback-error-100); --f: var(--feedback-error); }
.al-warning { --b: var(--feedback-warning-100); --f: var(--feedback-warning); }
.al-info { --b: var(--feedback-info-100); --f: var(--feedback-info); }
.al-success { --b: var(--feedback-success-100); --f: var(--feedback-success); }
.note { display: flex; gap: 8px; align-items: flex-start; font: 400 12px/16px var(--f-body); color: var(--text-secondary); }
.note .ph { margin-top: 1px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 40px 16px; }
.empty .ic { width: 56px; height: 56px; border-radius: 28px; background: var(--primary-50); color: var(--action-brand-text); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.empty p { margin: 0 0 8px; color: var(--text-secondary); max-width: 420px; font-size: 13px; }
.tip { position: absolute; z-index: 85; background: var(--primary-deep); color: var(--text-inverse); border-radius: 8px; padding: 7px 12px; font: 500 12px/16px var(--f-body); max-width: 280px; pointer-events: none; box-shadow: var(--e-md); }
.sticky-bar { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 10px; align-items: center; background: var(--surface-card); border: 1px solid var(--surface-border); border-radius: 16px; padding: 12px 16px; box-shadow: var(--e-xs); }
.phone .sticky-bar { border-radius: 0; margin: 0 -16px -24px; border-width: 1px 0 0; }
.phone .sticky-bar .btn { flex: 1; }

.weekday { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 10px; flex: 1; cursor: pointer; font: 400 12px/16px var(--f-body); color: var(--text-secondary); }

/* ---------- selectors used by every module ---------- */
const S = {
  client: (db, id) => db.clients.find((c) => c.id === id),
  contact: (db, o) => { const c = S.client(db, o.client); return c && c.contacts.find((x) => x.id === o.contact); },
  order: (db, no) => db.orders.find((o) => o.no === no),
  batch: (db, no) => db.batches.find((b) => b.no === no),
  batchesOf: (db, no) => db.batches.filter((b) => b.jo === no),
  user: (db, id) => db.users.find((u) => u.id === id),
  userByName: (db, n) => db.users.find((u) => u.name === n),
  signatory: (db, id) => db.signatories.find((s) => s.id === id),
  /* sample state on the job order (C6: Expected, In batch, Received, Awaiting arrival, Not received) */
  sampleState(db, o, s) {
    if (s.flag && s.flag.state === "notreceived") return "notreceived";
    if (s.flag && s.flag.state === "awaiting") return "awaiting";
    if (!s.batch) return "expected";
    const b = S.batch(db, s.batch); if (!b) return "expected";
    const r = b.rows[s.id];
    if (r && r.hold) return "held";
    return b.confirmed ? "received" : "inbatch";
  },
  currentCoa: (o) => { const live = o.coas.filter((c) => c.status !== "superseded" && c.status !== "void"); return live[live.length - 1] || null; },
  coaState(db, o) { // none | ready | draft | published | sent
    const c = S.currentCoa(o); if (c) return c.status;
    const bs = S.batchesOf(db, o.no);
    const allIn = o.samples.length && o.samples.every((s) => s.batch || (s.flag && s.flag.state === "notreceived"));
    return bs.length && allIn && bs.every((b) => b.status === "completed") ? "ready" : "none";
  },
  received: (db, o) => o.samples.filter((s) => S.sampleState(db, o, s) === "received" || S.sampleState(db, o, s) === "held").length,
  allCoas(db) { const out = []; db.orders.forEach((o) => o.coas.forEach((c) => out.push(Object.assign({ jo: o.no, client: o.client }, c)))); return out; },
  allRoas(db) { return db.batches.filter((b) => b.roa).map((b) => Object.assign({ batch: b.no, jo: b.jo, client: S.order(db, b.jo).client }, b.roa)); },
  progress(b) { // "values saved or samples received, by step"
    const n = b.samples.length;
    if (["created", "receiving"].includes(b.status)) return [b.samples.filter((s) => b.rows[s].arrived).length, n];
    if (["preparation", "prepfinished"].includes(b.status)) return [b.samples.filter((s) => b.rows[s].adl).length, n];
    const want = b.params.filter((p) => D.PARAM_INFO[p] && !["Ash analysis", "Trace elements", "Metal in ash", "Sizing"].includes(p)).length * b.samples.filter((s) => !b.rows[s].hold).length;
    const have = b.samples.reduce((a, s) => a + Object.keys(b.rows[s].values).length, 0);
    return [Math.min(have, want), want];
  },
};

/* My work (My_Work_Prototype_Plan.md): overview and queue pages, queues Q1 to Q7 of the screen plan. */
(function () {

        return [{ key: o.no, no: o.no, sub: c.name, client: c.id, jo: o.no, since: "2026-11-01", deadline: o.due, samples: w.map((s) => s.id), action: "Add batch", link: "order-" + o.no + "-batches" }]; }) },
